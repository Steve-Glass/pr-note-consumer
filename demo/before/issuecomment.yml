# DISPLAY ONLY: before native lockfile onboarding; never copy over an enrolled workflow.
# This file does not activate a baseline. Record the actual default-branch state.
name: PR note
run-name: PR note | comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post the note
        uses: Steve-Glass/pr-note@v3
        with:
          token: ${{ github.token }}
          body: Thanks for the pull request!
