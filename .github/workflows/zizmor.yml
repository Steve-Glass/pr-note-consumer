name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Analyze workflows
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          version: '1.30.1'
          advanced-security: true
