name: Firewall demo

on:
  workflow_dispatch:

permissions: {}

jobs:
  firewall-demo:
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 2

    steps:
      - name: Request a domain outside our allowlist
        shell: bash
        run: |
          echo "Requesting https://example.com/"
          curl --disable \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            https://example.com/
